name: Publish Package

on:
  push:
    tags:
      - 'v*'       # v2.2.0     → @tm11/mmgeo
      - 'map-v*'   # map-v0.1.0 → @tm11/mmgeo-map

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; latest npm needs Node >= 24.15.
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly runs typecheck, tests and build before publishing.
      - if: startsWith(github.ref_name, 'v')
        run: npm publish
      # A sub-folder publish doesn't run the root's prepublishOnly, so check and build first.
      - if: startsWith(github.ref_name, 'map-v')
        run: |
          npm run typecheck && npm test && npm run build
          npm publish ./packages/mmgeo-map
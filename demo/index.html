<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mmgeo playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font: 15px/1.6 system-ui, "Noto Sans Myanmar", sans-serif; color: #1f2937; background: #fafafa; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }
  h1 { font-size: 20px; margin: 0 0 4px; } p { margin: 0; color: #4b5563; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  select, button { font: inherit; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; min-height: 44px; }
  select { width: 100%; } button { cursor: pointer; } select:disabled { opacity: .5; }
  pre { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; font-size: 12px; white-space: pre-wrap; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="out/main.js"></script>
</body>
</html>

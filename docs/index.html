<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mmgeo: Myanmar states, townships and wards for JavaScript, with a React map picker</title>
<meta name="description" content="Bilingual (English/Myanmar) geographic data for Myanmar as an npm package: 15 states and regions, 84 districts, 356 townships, 3,481 wards and 13,771 village tracts with MIMU P-codes, Zawgyi-safe search, and a clickable React map picker.">
<meta property="og:title" content="mmgeo: Myanmar geographic data and map picker for JavaScript">
<meta property="og:description" content="MIMU P-codes, English and Burmese names, Zawgyi-safe search, and <MyanmarMap> for React.">
<meta property="og:url" content="https://tunmin11.github.io/mmgeo">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<!-- Production: app.js (npm run build:docs) imports these from the CDN. `npm run demo` bundles source instead. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "@tm11/mmgeo": "https://cdn.jsdelivr.net/npm/@tm11/mmgeo@2.2/dist/index.mjs",
    "@tm11/mmgeo/boundaries": "https://cdn.jsdelivr.net/npm/@tm11/mmgeo@2.2/dist/boundaries.mjs",
    "@tm11/mmgeo/react": "https://cdn.jsdelivr.net/npm/@tm11/mmgeo@2.2/dist/react.mjs",
    "@tm11/mmgeo/wards": "https://cdn.jsdelivr.net/npm/@tm11/mmgeo@2.2/dist/wards.mjs",
    "@tm11/mmgeo/village-tracts": "https://cdn.jsdelivr.net/npm/@tm11/mmgeo@2.2/dist/village-tracts.mjs",
    "@tm11/mmgeo-map": "https://cdn.jsdelivr.net/npm/@tm11/mmgeo-map@0.2/dist/index.mjs"
  }
}
</script>
<style>
  /* Paper, ink and survey gold. */
  :root {
    --paper: #fbfaf7; --ink: #21261f; --muted: #6d7268; --gold: #9a6c07; --line: #e4e1d6;
    --stage: #ffffff; --grid: rgba(33, 38, 31, 0.05);
    --code-bg: #1c211b; --code-ink: #e8e6da; --code-muted: #8f957f; --code-gold: #e3b341; --code-str: #a5c99b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15170f; --ink: #e8e6da; --muted: #9b9f8f; --gold: #d9a520; --line: #2c2f24; --stage: #f4f3ee; --grid: rgba(33, 38, 31, 0.06); --code-bg: #0e100a; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Myanmar", sans-serif; }
  a { color: var(--gold); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  code, pre { font-family: var(--mono); }
  code { font-size: 0.88em; }
  .loading { padding: 48px 24px; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 32px 20px 32px 24px; border-right: 1px solid var(--line); }
  .side .pkg { font: 700 17px/1.3 var(--mono); color: var(--ink); text-decoration: none; display: block; }
  .side .ver { color: var(--muted); font-size: 13px; margin: 2px 0 20px; }
  .side h2 { font-size: 13px; font-weight: 650; margin: 20px 0 4px; color: var(--ink); }
  .side ul { list-style: none; margin: 0; padding: 0; }
  .side li a { display: block; padding: 3px 10px; margin-left: -10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; }
  .side li a:hover { color: var(--ink); background: var(--line); }
  .side li a[aria-current="true"] { color: var(--gold); font-weight: 600; }
  .side .ext { margin-top: 28px; display: flex; gap: 14px; font-size: 13px; }

  .content { padding: 48px 48px 64px; max-width: 860px; min-width: 0; }
  .intro h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.025em; font-weight: 750; margin: 0 0 10px; max-width: 18ch; }
  .intro .mm { color: var(--gold); font-size: 18px; margin: 0 0 16px; }
  .intro > p { color: var(--muted); max-width: 62ch; margin: 0 0 12px; }

  /* Two packages, side by side: name, what it is, install line. */
  .packages { display: grid; gap: 20px; margin: 28px 0 0; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .packages dt code { font-size: 15px; font-weight: 650; color: var(--ink); }
  .packages dd { margin: 2px 0 0; color: var(--muted); }
  .install { display: inline-flex; align-items: center; max-width: 100%; padding-right: 8px; margin-top: 10px !important; background: var(--code-bg); color: var(--code-ink); border-radius: 8px; }
  .install pre { margin: 0; padding: 9px 8px 9px 14px; font-size: 13px; min-width: 0; white-space: pre-wrap; }
  .install .copy { flex-shrink: 0; }

  /* Counts read as a ledger: figure, then what it counts. */
  .counts { width: auto; margin-top: 20px; font-size: 15px; }
  .counts caption { white-space: nowrap; text-align: left; color: var(--muted); font-size: 13px; padding-bottom: 4px; }
  .counts td { padding: 3px 0; border: 0; color: var(--muted); }
  .counts td:first-child { text-align: right; padding-right: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

  .doc { margin-top: 64px; }
  .doc > h2 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 6px; }
  .doc > p { color: var(--muted); max-width: 62ch; margin: 0 0 18px; }
  .group-title { font-size: 13px; font-weight: 650; color: var(--muted); margin: 88px 0 -40px; padding-top: 16px; border-top: 1px solid var(--line); }
  .group-intro { color: var(--muted); max-width: 62ch; margin: 48px 0 -40px; }

  /* The preview stage: a survey sheet. Map, then what onChange said, then the code. */
  .example { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--stage); }
  .stage { padding: 20px; color: #1f2937; background: var(--stage); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 32px 32px; }
  /* The stage stays a light sheet in dark mode too: the map's default colours are made for it. */
  .readout { margin: 0; padding: 9px 20px; border-top: 1px solid var(--line); font: 12.5px/1.5 var(--mono); color: var(--muted); background: var(--paper); white-space: pre-wrap; }
  .readout b { color: var(--gold); font-weight: 500; }
  .code { position: relative; background: var(--code-bg); color: var(--code-ink); }
  .code pre { margin: 0; padding: 16px 20px; font-size: 13px; line-height: 1.7; overflow-x: auto; }
  .code .t { color: var(--code-gold); } .code .s { color: var(--code-str); } .code .c { color: var(--code-muted); }
  .copy { font: 12px/1 inherit; font-family: inherit; cursor: pointer; color: var(--code-muted); background: transparent; border: 1px solid #3a4034; border-radius: 6px; padding: 6px 10px; min-height: 30px; }
  .copy:hover { color: var(--code-ink); border-color: var(--code-muted); }
  .code .copy { position: absolute; top: 10px; right: 10px; }

  /* Function reference */
  .api > div { padding: 18px 0; border-top: 1px solid var(--line); }
  .api > div:last-child { border-bottom: 1px solid var(--line); }
  .api h3 { margin: 0; font-size: 15px; } .api h3 code { color: var(--gold); font-size: 14px; }
  .api p { margin: 4px 0 8px; color: var(--muted); max-width: 62ch; }
  .api pre { margin: 0; font-size: 12.5px; color: var(--muted); overflow-x: auto; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 650; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--ink); }
  td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); }
  td:first-child code { color: var(--gold); white-space: nowrap; }
  td code { color: var(--ink); }
  .table-wrap { overflow-x: auto; }

  /* Forms (Try it, Map and dropdowns) */
  .pair { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  .pair .form { border-left: 1px solid var(--line); }
  .form { padding: 20px; color: var(--ink); background: var(--paper); }
  .form label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
  .form select, .form input, .form button { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 44px; }
  .form select, .form input { width: 100%; } .form select:disabled { opacity: 0.5; }
  .form button { cursor: pointer; } .form button:hover { border-color: var(--gold); }
  .form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .form .grow { flex: 1 1 220px; } .form .grow label { margin-top: 0; }
  .form .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); column-gap: 16px; }
  .form pre { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 12px; background: var(--code-bg); color: var(--code-ink); white-space: pre-wrap; }
  .form .status { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .hits { list-style: none; margin: 8px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .hits li + li { border-top: 1px solid var(--line); }
  .form .hits button { width: 100%; text-align: left; border: 0; border-radius: 0; min-height: 40px; }
  .form .hits button:hover { background: var(--line); }
  .hits small { color: var(--muted); margin-left: 6px; }

  footer { margin-top: 96px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  footer p { margin: 0 0 4px; }

  @media (max-width: 860px) {
    .layout { display: block; }
    .side { position: sticky; z-index: 2; height: auto; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); background: var(--paper); display: flex; gap: 16px; align-items: center; overflow-x: auto; white-space: nowrap; }
    .side .ver, .side h2, .side .ext { display: none; }
    .side ul { display: flex; gap: 4px; } .side li a { margin: 0; }
    .content { padding: 32px 16px 64px; }
    .pair { grid-template-columns: 1fr; } .pair .form { border-left: 0; border-top: 1px solid var(--line); }
    .stage { padding: 12px; }
  }
</style>
</head>

</body>
</html>

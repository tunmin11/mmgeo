<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mmgeo playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font: 15px/1.6 system-ui, "Noto Sans Myanmar", sans-serif; color: #1f2937; background: #f6f7f9; }
  main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0 0 12px; } h2 { font-size: 17px; margin: 0 0 4px; }
  p { margin: 0 0 10px; color: #4b5563; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); align-items: start; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; min-width: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  select, .row button { font: inherit; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; min-height: 44px; }
  select { width: 100%; } .row button { cursor: pointer; } select:disabled { opacity: .5; }
  .row button[aria-pressed="true"] { background: #1f2937; color: #fff; border-color: #1f2937; }
  pre { margin: 8px 0 0; border-radius: 8px; padding: 10px 12px; font-size: 12px; white-space: pre-wrap; overflow-x: auto; }
  pre.code { background: #1f2937; color: #e5e7eb; } pre.out { background: #f3f4f6; color: #111827; }
  .notice { background: #fff8db; border: 1px solid #f3e3a1; color: #5b4a00; border-radius: 8px; padding: 10px 12px; }
  code { font-size: 0.92em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="out/main.js"></script>
</body>
</html>
